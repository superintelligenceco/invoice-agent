[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "invoice-agent"
version = "0.2.0"
description = "Extract invoice PDFs and run 2-way/3-way matching against purchase orders and receipts, with explainable decisions."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "superintelligenceco contributors" }]
keywords = ["accounts-payable", "invoice", "three-way-match", "purchase-order", "pdf", "extraction", "fintech"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6",
  "pdfplumber>=0.11",
  "pypdf>=4.0",
  "rapidfuzz>=3.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
synth = ["reportlab>=4.0"]
ocr = ["pytesseract>=0.3.10"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
dev = [
  "invoice-agent[api,synth]",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-benchmark>=4.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
invoice-agent = "invoice_agent.cli:main"

[project.urls]
Homepage = "https://github.com/superintelligenceco/invoice-agent"
Issues = "https://github.com/superintelligenceco/invoice-agent/issues"
Changelog = "https://github.com/superintelligenceco/invoice-agent/blob/main/CHANGELOG.md"
Documentation = "https://superintelligenceco.github.io/invoice-agent/"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_agent"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["invoice_agent"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pytesseract.*", "reportlab.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: slower tests that the nightly workflow runs with more examples"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["invoice_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mutmut]
# Scoped to the pure core. Run with `make mutate`; the Mutation workflow runs it weekly.
source_paths = ["src/invoice_agent"]
do_not_mutate = [
  "src/invoice_agent/api.py",
  "src/invoice_agent/cli.py",
  "src/invoice_agent/data.py",
  "src/invoice_agent/evaluate.py",
  "src/invoice_agent/ingest.py",
  "src/invoice_agent/match.py",
  "src/invoice_agent/pipeline.py",
  "src/invoice_agent/policy.py",
  "src/invoice_agent/reasons.py",
  "src/invoice_agent/schema.py",
  "src/invoice_agent/__init__.py",
  "src/invoice_agent/extract/*",
  "src/invoice_agent/synth/*",
]
pytest_add_cli_args_test_selection = [
  "tests/test_normalize.py",
  "tests/test_validate.py",
  "tests/test_properties.py",
]
pytest_add_cli_args = ["--benchmark-disable", "-p", "no:cacheprovider"]
