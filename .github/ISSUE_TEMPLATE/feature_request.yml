name: Feature request
description: Suggest a matching rule, an invoice layout, a data source, or an API change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What does your AP process need that invoice-agent can't do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you want. For a new rule, include the reason code, its severity, and an example invoice and PO.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - extraction
        - matching rules and tolerances
        - duplicate detection
        - data sources (CSV, JSON, SQLite, ERP)
        - eval dataset
        - CLI
        - HTTP API
        - other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
