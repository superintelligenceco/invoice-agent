# The full suite on a schedule: many more property-based examples, the benchmarks, the eval, and
# an integration test of the container image over HTTP.
name: Nightly

on:
  schedule:
    - cron: "11 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    name: Full suite (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      HYPOTHESIS_PROFILE: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Pytest, including slow tests and benchmarks
        run: pytest --cov --cov-report=term tests benchmarks
      - name: Eval, end to end and oracle
        run: |
          invoice-agent eval --min-decision-accuracy 1
          invoice-agent eval --oracle --min-decision-accuracy 1

  image:
    name: Container integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the stack with docker compose
        run: docker compose up -d --build --wait
      - name: Process every shipped invoice over HTTP
        run: scripts/http_eval.sh http://127.0.0.1:8000
      - name: Logs
        if: always()
        run: docker compose logs
      - run: docker compose down
        if: always()
