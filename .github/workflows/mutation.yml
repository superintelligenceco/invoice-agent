# Mutation testing of the pure core (normalize.py and validate.py) with mutmut. Weekly and on
# demand; the score goes to the job summary and the full results are a run artifact.
name: Mutation

on:
  schedule:
    - cron: "37 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    name: mutmut
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]" "mutmut==3.8.0"
      - name: Run mutmut
        run: mutmut run --max-children 4 > /dev/null
      - name: Summary
        if: always()
        run: |
          mutmut results --all true > results.txt || true
          killed=$(grep -c ': killed$' results.txt || true)
          total=$(grep -c ': ' results.txt || true)
          {
            echo "## Mutation testing"
            echo
            echo "Killed $killed of $total mutants in normalize.py and validate.py."
            echo
            echo "Surviving mutants:"
            echo
            echo '```'
            grep -v ': killed$' results.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutmut-results
          path: |
            results.txt
            mutants/**/*.meta
