# Builds everything a user downloads or runs:
#   - the wheel and sdist,
#   - standalone `invoice-agent` executables (PyInstaller) for four platforms, plus SHA256SUMS,
#   - a multi-arch (linux/amd64, linux/arm64) image on ghcr.io that serves the web page and API.
#
# Triggers:
#   - workflow_call from release.yml when release-please creates a release (tag in `inputs.tag`),
#   - a pushed `v*` tag (creates the GitHub Release if it doesn't exist yet),
#   - workflow_dispatch: files become run artifacts and the image is tagged `:edge`.
# Release runs attach the files to the GitHub Release and tag the image `:vX.Y.Z` and `:latest`.
name: Ship

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach assets to, for example v0.2.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ship-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  # Empty on workflow_dispatch; the release tag otherwise.
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
  PYINSTALLER_VERSION: "6.22.3"

jobs:
  dist:
    name: Wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build --outdir dist
      - name: Smoke test the wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/venv/bin/invoice-agent" process dataset/invoices/001_q01.pdf \
            --pos dataset/purchase_orders.json --receipts dataset/receipts.json | tee out.txt
          grep -q "AUTO-APPROVE" out.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  exe:
    name: Executable (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest, ext: "" }
          - { target: linux-arm64, os: ubuntu-24.04-arm, ext: "" }
          - { target: macos-arm64, os: macos-latest, ext: "" }
          - { target: windows-x64, os: windows-latest, ext: ".exe" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[api]" "pyinstaller==${PYINSTALLER_VERSION}"
      - name: Build
        run: |
          pyinstaller --onefile --name invoice-agent --noconfirm \
            --collect-data invoice_agent --collect-data pdfminer --collect-submodules uvicorn \
            --distpath out --workpath "$RUNNER_TEMP/pyi" --specpath "$RUNNER_TEMP/pyi" \
            packaging/entry.py
          mkdir -p exe
          mv "out/invoice-agent${{ matrix.ext }}" "exe/invoice-agent-${{ matrix.target }}${{ matrix.ext }}"
      - name: Smoke test
        run: |
          bin="exe/invoice-agent-${{ matrix.target }}${{ matrix.ext }}"
          "$bin" --version
          "$bin" process dataset/invoices/001_q01.pdf dataset/invoices/016_b04.pdf \
            --pos dataset/purchase_orders.json --receipts dataset/receipts.json | tee out.txt
          grep -q "001_q01.pdf: AUTO-APPROVE" out.txt
          grep -q "016_b04.pdf: NEEDS REVIEW" out.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: invoice-agent-${{ matrix.target }}
          path: exe/*
          if-no-files-found: error

  image:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=raw,value=latest,enable=${{ env.RELEASE_TAG != '' }}
            type=raw,value=edge,enable=${{ env.RELEASE_TAG == '' }}
          flavor: latest=false
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke test the pushed image on both architectures
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          port=8000
          for platform in linux/amd64 linux/arm64; do
            port=$((port + 1))
            docker run -d --rm --platform "$platform" --name "smoke-$port" -p "$port:8000" "$REF"
            for _ in $(seq 60); do curl -fsS "http://127.0.0.1:$port/health" && break; sleep 2; done
            curl -fsS "http://127.0.0.1:$port/" | grep -q 'type="file"'
            curl -fsS -F file=@dataset/invoices/016_b04.pdf "http://127.0.0.1:$port/process" \
              | tee resp.json
            grep -q '"decision":"needs_review"' resp.json
            docker stop "smoke-$port"
          done

  release:
    name: Attach assets to the release
    if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
    needs: [dist, exe, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" assets/* --clobber

  checksums:
    name: SHA256SUMS artifact
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [dist, exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - working-directory: assets
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SHA256SUMS
          path: assets/SHA256SUMS
