# Builds everything a user downloads or runs:
#   - the wheel and sdist,
#   - standalone `invoice-agent` executables (PyInstaller) for four platforms, plus SHA256SUMS,
#   - a multi-arch (linux/amd64, linux/arm64) image on ghcr.io that serves the web page and API,
#   - SPDX SBOMs for the source tree and the image, build provenance attestations for every
#     release file and the image, and a keyless cosign signature on the image,
#   - on a tag, the wheel and sdist published to PyPI as `invoice-agent`.
#
# Triggers:
#   - a pushed `v*` tag: creates the GitHub Release from the CHANGELOG section, attaches the
#     files, and tags the image `:vX.Y.Z` and `:latest`,
#   - workflow_dispatch: files become run artifacts and the image is tagged `:edge`.
name: Ship

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: false

env:
  # Empty on workflow_dispatch; the release tag otherwise.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
  PYINSTALLER_VERSION: "6.22.3"

jobs:
  dist:
    name: Wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build --outdir dist
      - name: Smoke test the wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/venv/bin/invoice-agent" process dataset/invoices/001_q01.pdf \
            --pos dataset/purchase_orders.json --receipts dataset/receipts.json | tee out.txt
          grep -q "AUTO-APPROVE" out.txt
      - name: SBOM of the source tree
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/invoice-agent-source.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  exe:
    name: Executable (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest, ext: "", older_glibc: true }
          - { target: linux-arm64, os: ubuntu-24.04-arm, ext: "", older_glibc: true }
          - { target: macos-arm64, os: macos-latest, ext: "", older_glibc: false }
          - { target: windows-x64, os: windows-latest, ext: ".exe", older_glibc: false }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ !matrix.older_glibc }}
        with:
          python-version: "3.12"
      - name: Build
        env:
          OLDER_GLIBC: ${{ matrix.older_glibc }}
        run: |
          if [ "$OLDER_GLIBC" = true ]; then
            # Build on Debian 11 (glibc 2.31) so the executable runs on older distributions too.
            docker run --rm -e PYINSTALLER_VERSION -v "$PWD:/src" -w /src \
              python:3.12-bullseye packaging/build_exe.sh
            sudo chown -R "$(id -u):$(id -g)" out
          else
            packaging/build_exe.sh
          fi
          mkdir -p exe
          mv "out/invoice-agent${{ matrix.ext }}" "exe/invoice-agent-${{ matrix.target }}${{ matrix.ext }}"
      - name: Smoke test
        run: |
          bin="exe/invoice-agent-${{ matrix.target }}${{ matrix.ext }}"
          "$bin" --version
          "$bin" process dataset/invoices/001_q01.pdf dataset/invoices/016_b04.pdf \
            --pos dataset/purchase_orders.json --receipts dataset/receipts.json | tee out.txt
          grep -q "001_q01.pdf: AUTO-APPROVE" out.txt
          grep -q "016_b04.pdf: NEEDS REVIEW" out.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: invoice-agent-${{ matrix.target }}
          path: exe/*
          if-no-files-found: error

  image:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=raw,value=latest,enable=${{ env.RELEASE_TAG != '' }}
            type=raw,value=edge,enable=${{ env.RELEASE_TAG == '' }}
          flavor: latest=false
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke test the pushed image on both architectures
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          # Run each platform by its own manifest digest. Pulling the same index digest twice
          # with different --platform values fails with "cannot overwrite digest".
          port=8000
          for platform in linux/amd64 linux/arm64; do
            port=$((port + 1))
            digest="$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' \
              | jq -r --arg p "$platform" \
                '.manifests[] | select(.platform.os + "/" + .platform.architecture == $p) | .digest')"
            echo "$platform: $digest"
            docker run -d --rm --platform "$platform" --name "smoke-$port" -p "$port:8000" \
              "$IMAGE@$digest"
            for _ in $(seq 60); do curl -fsS "http://127.0.0.1:$port/health" && break; sleep 2; done
            curl -fsS "http://127.0.0.1:$port/" | grep -q 'type="file"'
            curl -fsS -F file=@dataset/invoices/016_b04.pdf "http://127.0.0.1:$port/process" \
              | tee resp.json
            grep -q '"decision":"needs_review"' resp.json
            docker stop "smoke-$port"
          done
      - name: Scan the image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image with cosign (keyless)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"
      - name: Attest build provenance for the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: SBOM of the image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: invoice-agent-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-image
          path: invoice-agent-image.spdx.json
          if-no-files-found: error
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Image"
            echo
            echo "Digest: \`$IMAGE@$DIGEST\`"
            echo
            echo "Tags:"
            printf '%s\n' "$TAGS" | while IFS= read -r t; do echo "- $t"; done
            echo
            echo "Verify the signature:"
            echo
            echo '```sh'
            echo "cosign verify $IMAGE@$DIGEST \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  files:
    name: Checksums, provenance, and release
    needs: [dist, exe, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: assets
        run: |
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance for the files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS
      - name: Keep the files as a run artifact
        if: ${{ env.RELEASE_TAG == '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: assets/*
      - name: Create or update the GitHub Release
        if: ${{ env.RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${RELEASE_TAG#v}"
          # The release notes are the CHANGELOG section for this version.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file notes.md
          fi
          gh release upload "$RELEASE_TAG" assets/* --clobber

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [files]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/invoice-agent/
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Keep only the wheel and sdist
        run: |
          find dist -type f ! -name '*.whl' ! -name '*.tar.gz' -delete
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          # Attestations on PyPI need trusted publishing; the release files carry GitHub attestations.
          attestations: false
