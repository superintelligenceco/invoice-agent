# release-please opens the release PR and, when it merges, creates the tag and the GitHub
# Release. Tags created with GITHUB_TOKEN don't trigger other workflows, so this workflow
# calls ship.yml directly to build and attach the downloadable assets.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  ship:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/ship.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
